<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .container { border: 2px solid #c9a050; border-radius: 15px; padding: 20px; background: #1a1a1a; box-shadow: 0 0 20px rgba(201, 160, 80, 0.3); }
        h1 { color: #c9a050; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 5px; }
        .rank { font-size: 60px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #c9a050; margin: 10px 0; }
        
        /* Список участников */
        .user-list { text-align: left; margin-top: 20px; }
        .user-item { 
            display: flex; justify-content: space-between; align-items: center;
            background: #262626; padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #c9a050;
        }
        .vote-btn { 
            background: #c9a050; color: #000; border: none; padding: 5px 15px; 
            border-radius: 5px; font-weight: bold; cursor: pointer; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PIRAMIDA</h1>
        <div class="rank">A</div>
        
        <div class="user-list">
            <div class="user-item">
                <span>1. Shokruz (Admin)</span>
                <button class="vote-btn" onclick="vote('Shokruz')">Голос</button>
            </div>
            <div class="user-item">
                <span>2. Участник 1</span>
                <button class="vote-btn" onclick="vote('User1')">Голос</button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function vote(name) {
            tg.sendData("Голос за: " + name);
            tg.close();
        }
    </script>
</body>
</html>
